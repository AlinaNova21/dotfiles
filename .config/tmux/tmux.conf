# tmux config — mise-managed (repo .config/tmux/tmux.conf)
# Base options + user binds (ported from home-manager programs.tmux)

# prefix: C-a
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" C-a send-prefix

# mouse + focus
set  -g mouse on
setw -g aggressive-resize on
setw -g clock-mode-style 24
set  -g base-index 1
setw -g pane-base-index 1

# history
set  -g history-limit 2000

# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# status bar
set -g status-bg blue
set -g status-fg white

# window swap bindings
bind-key -n C-S-Left  swap-window -t -1
bind-key -n C-S-Right swap-window -t +1
