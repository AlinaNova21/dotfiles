[bootstrap.packages]
# Foundational system tools (not mise tools — no registry entry / system-managed)
"pacman:git" = { os = "linux" }
"brew:git" = { os = "macos" }
"pacman:zsh" = { os = "linux" }
"brew:zsh" = { os = "macos" }
# Security tooling — op/1password-cli is system-managed (provides /usr/bin/op, root-owned setuid-group)
"pacman:1password-cli" = { os = "linux" }
"brew:1password-cli" = { os = "macos" }
# Secrets baseline (home-ops pins these project-side too; keep global for general use)
"pacman:age" = { os = "linux" }
"brew:age" = { os = "macos" }
"brew:sops" = { os = "macos" }