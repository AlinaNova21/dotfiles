[bootstrap.packages]
# Foundational system tools (not mise tools — no registry entry / system-managed)
"pacman:git" = { os = "linux" }
"brew:git" = { os = "macos" }
"pacman:zsh" = { os = "linux" }
"brew:zsh" = { os = "macos" }
# tmux (no mise registry entry)
"pacman:tmux" = { os = "linux" }
"brew:tmux" = { os = "macos" }
# Security tooling — op/1password-cli is system-managed (provides /usr/bin/op, root-owned setuid-group)
"pacman:1password-cli" = { os = "linux" }
"brew:1password-cli" = { os = "macos" }
# age/sops are mise tools (see 10-default.toml) — not system packages.
# git/zsh have no mise registry entry and are system-level; op is system-managed.